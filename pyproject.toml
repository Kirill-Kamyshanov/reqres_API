[project]
name = "reqres-api-tests"
version = "1.1.0"
description = "API autotests for reqres.in"
requires-python = ">=3.11"
dependencies = [
    "allure-pytest==2.15.3",
    "allure-python-commons==2.15.3",
    "annotated-types==0.7.0",
    "async-generator==1.10",
    "attrs==25.4.0",
    "bidict==0.23.1",
    "blinker==1.9.0",
    "brotli==1.2.0",
    "certifi==2026.1.4",
    "cffi==2.0.0",
    "charset-normalizer==3.4.5",
    "click==8.3.1",
    "colorama==0.4.6",
    "configargparse==1.7.5",
    "django-qrcode==0.3",
    "dnspython==2.8.0",
    "email-validator==2.3.0",
    "execnet==2.1.2",
    "faker==40.13.0",
    "flask==3.1.3",
    "flask-cors==6.0.2",
    "flask-login==0.6.3",
    "furl==2.1.4",
    "gevent==25.9.1",
    "geventhttpclient==2.3.9",
    "greenlet==3.3.2",
    "h11==0.16.0",
    "idna==3.11",
    "importlib-metadata==8.7.1",
    "iniconfig==2.3.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "locust==2.43.3",
    "markupsafe==3.0.3",
    "msgpack==1.1.2",
    "mypy-extensions==1.1.0",
    "mysql-connector-python==9.6.0",
    "orderedmultidict==1.0.2",
    "outcome==1.3.0.post0",
    "packaging==26.0",
    "pillow==12.2.0",
    "pluggy==1.6.0",
    "pook==2.1.6",
    "pre-commit==4.6.2",
    "psutil==7.2.2",
    "pycparser==3.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pydantic-settings==2.14.1",
    "pygments==2.19.2",
    "pysocks==1.7.1",
    "pytest==9.0.2",
    "pytest-dependency==0.6.1",
    "pytest-rerunfailures==16.1",
    "pytest-timeout==2.3.1",
    "pytest-xdist==3.8.0",
    "python-dotenv==1.2.1",
    "python-engineio==4.13.1",
    "python-socketio==5.16.1",
    "pyzmq==27.1.0",
    "qrcode==8.2",
    "referencing==0.37.0",
    "requests==2.32.5",
    "rpds-py==0.30.0",
    "selenium==4.40.0",
    "setuptools==82.0.1",
    "simple-websocket==1.1.0",
    "six==1.17.0",
    "sniffio==1.3.1",
    "sortedcontainers==2.4.0",
    "trio==0.32.0",
    "trio-typing==0.10.0",
    "trio-websocket==0.12.2",
    "types-certifi==2021.10.8.3",
    "types-urllib3==1.26.25.14",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "tzdata==2026.1",
    "urllib3==2.6.3",
    "websocket-client==1.9.0",
    "werkzeug==3.1.6",
    "wsproto==1.3.2",
    "xmltodict==1.0.4",
    "zipp==3.23.0",
    "zope-event==6.1",
    "zope-interface==8.2",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "smoke: smoke tests",
    "regression: regression tests",
]
addopts = [
    "--alluredir=allure-results",
    "--strict-markers",
    "-ra",
    "-n 3",
    "--reruns=2",
    "--reruns-delay=1",
    "--timeout=60",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "allure-results", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "B008",    # function call in default arg (Pydantic Field)
    "RUF001",  # cyrillic ambiguous chars (тексты на русском)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert allowed in tests

[tool.ruff.format]
quote-style = "double"
